{{- /*
charts/tasktracker/templates/frontend-deployment.yaml
Assignment: DSO202 A4 | Descriptor: 1.5.3, 3.2
Purpose: the nginx frontend. Wave "2" (C5): last tier. BACKEND_URL is
written into config.js by the image entrypoint at start-up.
*/}}
{{- $tier := dict "ctx" . "tier" "frontend" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tasktracker.frontendName" . }}
  labels:
    {{- include "tasktracker.labels" $tier | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  progressDeadlineSeconds: {{ .Values.frontend.progressDeadlineSeconds }}
  selector:
    matchLabels:
      {{- include "tasktracker.selectorLabels" $tier | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tasktracker.labels" $tier | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "tasktracker.fullname" . }}-frontend
      containers:
        - name: frontend
          image: {{ include "tasktracker.image" (dict "image" .Values.frontend.image "tier" "frontend") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "tasktracker.configName" . }}
                  key: BACKEND_URL
            {{- include "tasktracker.extraEnv" .Values.frontend.env | nindent 12 }}
          readinessProbe:               # C4
            httpGet:
              path: {{ .Values.frontend.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.frontend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.frontend.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.frontend.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.frontend.readinessProbe.failureThreshold }}
          resources:                    # C7
            {{- toYaml .Values.frontend.resources | nindent 12 }}
