{{- /*
charts/tasktracker/templates/db-statefulset.yaml
Assignment: DSO202 A4 | Descriptor: 2.1, 3.1.4 (StatefulSet from A2)
Purpose: PostgreSQL as a one-replica StatefulSet. The PVC comes from
volumeClaimTemplates, so the chart renders no PersistentVolumeClaim and the
dso202 project needs no PVC permission. Sync wave "0" (C5): first tier.
updateStrategy is RollingUpdate; OnDelete would leave Argo CD "Progressing".
*/}}
{{- $tier := dict "ctx" . "tier" "database" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tasktracker.dbName" . }}
  labels:
    {{- include "tasktracker.labels" $tier | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: {{ include "tasktracker.dbName" . }}
  replicas: 1                     # one ReadWriteOnce volume, one Pod
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "tasktracker.selectorLabels" $tier | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tasktracker.labels" $tier | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "tasktracker.fullname" . }}-database
      containers:
        - name: postgres
          image: {{ include "tasktracker.image" (dict "image" .Values.database.image "tier" "database") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # The official postgres image expects POSTGRES_*, not DB_*
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "tasktracker.configName" . }}
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "tasktracker.secretName" . }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tasktracker.secretName" . }}
                  key: POSTGRES_PASSWORD
            {{- include "tasktracker.extraEnv" .Values.database.env | nindent 12 }}
          readinessProbe:               # C4
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            initialDelaySeconds: {{ .Values.database.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.database.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.database.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.database.readinessProbe.failureThreshold }}
          resources:                    # C7
            {{- toYaml .Values.database.resources | nindent 12 }}
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: db-data
        labels:
          {{- include "tasktracker.selectorLabels" $tier | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.database.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.persistence.size }}
