{{- /*
charts/tasktracker/templates/backend-service.yaml
Assignment: DSO202 A4 | Descriptor: 1.5.1 (Services)
Purpose: ClusterIP Service for the backend. Type fixed in the template, so
no value can expose the backend outside the cluster. Wave "1" (C5).
*/}}
{{- $tier := dict "ctx" . "tier" "backend" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tasktracker.backendName" . }}
  labels:
    {{- include "tasktracker.labels" $tier | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  selector:
    {{- include "tasktracker.selectorLabels" $tier | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
