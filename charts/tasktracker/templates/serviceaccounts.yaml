{{- /*
charts/tasktracker/templates/serviceaccounts.yaml
Assignment: DSO202 A4 | Descriptor: 2.3 (ServiceAccounts), reused from A2
Purpose: one ServiceAccount per tier, with no API token mounted, because no
tier talks to the Kubernetes API. Wave -1: exists before the workloads.
*/}}
{{- range $tier := list "database" "backend" "frontend" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-%s" (include "tasktracker.fullname" $) $tier }}
  labels:
    {{- include "tasktracker.labels" (dict "ctx" $ "tier" $tier) | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: false
{{- end }}
