{{- /*
charts/tasktracker/templates/db-service.yaml
Assignment: DSO202 A4 | Descriptor: 1.5.1 (Services)
Purpose: headless Service for the database StatefulSet. Fixed in the template
so no value can expose the database. Same wave as the database (C5).
*/}}
{{- $tier := dict "ctx" . "tier" "database" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tasktracker.dbName" . }}
  labels:
    {{- include "tasktracker.labels" $tier | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  clusterIP: None
  selector:
    {{- include "tasktracker.selectorLabels" $tier | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
