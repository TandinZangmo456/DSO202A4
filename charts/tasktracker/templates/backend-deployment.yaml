{{- /*
charts/tasktracker/templates/backend-deployment.yaml
Assignment: DSO202 A4 | Descriptor: 1.5.3, 3.2
Purpose: the REST backend. Wave "1" (C5): starts after the database is
Healthy. progressDeadlineSeconds 120 (C6) makes a broken rollout turn
Degraded in Argo CD after two minutes instead of ten.
*/}}
{{- $tier := dict "ctx" . "tier" "backend" }}
{{- $config := include "tasktracker.configName" . }}
{{- $secret := include "tasktracker.secretName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tasktracker.backendName" . }}
  labels:
    {{- include "tasktracker.labels" $tier | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.backend.replicaCount }}
  progressDeadlineSeconds: {{ .Values.backend.progressDeadlineSeconds }}
  selector:
    matchLabels:
      {{- include "tasktracker.selectorLabels" $tier | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tasktracker.labels" $tier | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "tasktracker.fullname" . }}-backend
      containers:
        - name: backend
          image: {{ include "tasktracker.image" (dict "image" .Values.backend.image "tier" "backend") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.appPort }}
          env:
            # The backend uses DB_*, not POSTGRES_*
            {{- range list "DB_HOST" "DB_PORT" "DB_NAME" "APP_PORT" "CORS_ORIGIN" }}
            - name: {{ . }}
              valueFrom:
                configMapKeyRef:
                  name: {{ $config }}
                  key: {{ . }}
            {{- end }}
            {{- range list "DB_USER" "DB_PASSWORD" }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ . }}
            {{- end }}
            # C2: extra settings from values (backend.env)
            {{- include "tasktracker.extraEnv" .Values.backend.env | nindent 12 }}
          readinessProbe:               # C4
            httpGet:
              path: {{ .Values.backend.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.readinessProbe.failureThreshold }}
          resources:                    # C7
            {{- toYaml .Values.backend.resources | nindent 12 }}
