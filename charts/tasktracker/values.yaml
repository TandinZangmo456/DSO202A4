# charts/tasktracker/values.yaml
# Assignment: DSO202 A4 (GitOps delivery of the Task Tracker with Argo CD)
# Descriptor: 3.2 (Helm values), adjusted in A4 Task 1 for contract C1-C11
# Purpose: chart defaults shared by every environment. Environment files in
# environments/<env>/values.yaml hold ONLY the differences: image tags,
# replicas, NodePort and existingSecret. Templates never test the environment
# name (design rule 2).

# Environment name, used for labels only. Required; set by the environment file.
environment: ""

# Shared pull policy. Never "Always": images are loaded into kind from the host.
image:
  pullPolicy: IfNotPresent

# C3: the chart never renders a Secret. Pods read credentials from this
# existing Secret, which the platform layer creates from a SealedSecret.
# Keys expected: DB_USER, DB_PASSWORD, POSTGRES_USER, POSTGRES_PASSWORD.
existingSecret: ""

# Non-sensitive settings rendered into the ConfigMap. DB_HOST and BACKEND_URL
# are built from the Service names by the templates, so they cannot drift.
config:
  dbName: tasktracker
  dbPort: 5432
  appPort: 8080
  corsOrigin: "*"

database:
  image:
    repository: sarojsanyasi/dso202-db
    tag: ""                       # C1: set per environment ("1.0")
  env: {}                         # C2: extra plain env vars, KEY: value
  resources:                      # C7
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    size: 1Gi
    storageClass: standard        # kind's default provisioner
  readinessProbe:                 # C4: pg_isready inside the container
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 6

backend:
  image:
    repository: sarojsanyasi/dso202-backend
    tag: ""                       # C1: set per environment
  replicaCount: 1
  # C2: extra backend configuration. Adding a variable here is a values-only
  # change; no template edit is needed. Example:  SOME_SETTING: "value"
  env: {}
  resources:                      # C7
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  service:
    port: 8080                    # ClusterIP only; the backend is never exposed
  readinessProbe:                 # C4: GET /api/status
    path: /api/status
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 6
  progressDeadlineSeconds: 120    # C6

frontend:
  image:
    repository: sarojsanyasi/dso202-frontend
    tag: ""                       # C1: set per environment
  replicaCount: 1
  env: {}                         # C2
  resources:                      # C7
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  service:
    port: 8080
    nodePort: 30080               # C10: 30080 dev, 30081 staging (set per env)
  readinessProbe:                 # C4: nginx serves the page at /
    path: /
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 6
  progressDeadlineSeconds: 120    # C6

# C9: disabled by default. The dso202 AppProject does not allow Ingress, so
# enabling this would be rejected at sync time (least privilege).
ingress:
  enabled: false
  className: nginx
  host: tasktracker.local

# PostSync smoke test (Task 5). Calls the backend Service from inside the
# namespace after every successful sync.
smokeTest:
  enabled: true
  image: busybox:1.37             # pinned
  path: /api/tasks
  attempts: 10
  intervalSeconds: 3
  resources:                      # C7: the quota rejects containers without these
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi

nameOverride: ""
fullnameOverride: ""
