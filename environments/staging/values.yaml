# environments/staging/values.yaml
# Assignment: DSO202 A4 (GitOps delivery of the Task Tracker with Argo CD)
# Descriptor: 4.3.2 (environment configuration)
# Purpose: staging differences only. Read by tasktracker-staging, which is
# pinned to a Git tag and synced by hand (promotion gate). A change here on
# main has no effect on staging until a new tag is promoted.
environment: staging
existingSecret: tasktracker-credentials   # created from platform/staging SealedSecret

database:
  image:
    tag: "1.0"
backend:
  image:
    tag: "1.0"
  replicaCount: 1
frontend:
  image:
    tag: "1.0"
  replicaCount: 1
  service:
    nodePort: 30081                       # not mapped; reach it with port-forward
