# environments/dev/values.yaml
# Assignment: DSO202 A4 (GitOps delivery of the Task Tracker with Argo CD)
# Descriptor: 4.3.2 (environment configuration)
# Purpose: dev differences only. Read by the tasktracker-dev Application,
# which follows branch main with automated sync (fast feedback).
environment: dev
existingSecret: tasktracker-credentials   # created from platform/dev SealedSecret

database:
  image:
    tag: "1.0"
backend:
  image:
    tag: "1.0"
  replicaCount: 1
frontend:
  image:
    tag: "1.0"
  replicaCount: 1
  service:
    nodePort: 30080                       # mapped to the host by kind
