# cluster/kind-cluster.yaml
# Assignment: DSO202 A4 (GitOps delivery of the Task Tracker with Argo CD)
# Descriptor: 1.2.5 (local cluster with kind), reused
# Purpose: the single-node kind cluster "dso202-gitops". Only host port 30080
# (dev frontend NodePort) is mapped. Staging uses NodePort 30081 inside the
# cluster and is reached with kubectl port-forward, so no second mapping.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dso202-gitops
nodes:
  - role: control-plane
    # Pin the node image used in Practical 1 (same kind version, same image).
    # Uncomment and set it, e.g.  image: kindest/node:v1.33.1
    # image: kindest/node:vX.Y.Z
    extraPortMappings:
      - containerPort: 30080      # dev frontend NodePort
        hostPort: 30080           # http://localhost:30080
        protocol: TCP
